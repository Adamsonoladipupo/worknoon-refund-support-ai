# ─────────────────────────────────────────────────────────────────────────────
# Worknoon Refund System — Docker Compose
#
# Usage:
#   1. Copy .env.example to .env and fill in AI_API_KEY
#   2. docker compose up --build
#
# Services:
#   db        — PostgreSQL 16 (data persisted in a named volume)
#   backend   — FastAPI (runs migrations + seed on startup, then uvicorn)
#   frontend  — React/Vite built at image build time, served by nginx
#
# Access:
#   Frontend  → http://localhost:5173
#   Backend   → http://localhost:8000
#   API docs  → http://localhost:8000/docs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: worknoon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: worknoon
      POSTGRES_USER: worknoon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worknoon_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worknoon -d worknoon"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worknoon-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database — use the service name "db" for container-to-container comms.
      DATABASE_URL: postgresql+psycopg://worknoon:${POSTGRES_PASSWORD:-worknoon_dev_password}@db:5432/worknoon
      # Application
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      # AI — injected from the host .env; NEVER hard-code a real key here.
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (React → nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser makes API calls from the user's machine, so the URL
        # must be the *host-side* port, not the docker-internal service name.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: worknoon-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
